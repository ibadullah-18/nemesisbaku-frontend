name: Deploy NemesisBaku Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/nemesisbaku/frontend
            git pull origin main

            cd ${{ secrets.VPS_PROJECT_PATH }}
            docker compose -f docker-compose.yml -f docker-compose.osrm.yml config --quiet
            docker compose -f docker-compose.yml -f docker-compose.osrm.yml build frontend
            docker compose -f docker-compose.yml -f docker-compose.osrm.yml up -d --no-deps frontend
            docker compose exec -T nginx nginx -s reload

            docker image prune -f